  server:
    port: 8080

  spring:
    application:
      name: dozzer-backend

    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/dozzer}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgres}

    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
          format_sql: true

    liquibase:
      change-log: classpath:db/changelog/db.changelog-master.xml

    jackson:
      default-property-inclusion: non_null

    # Fotos del inventario anual (se comprimen en el celular, ~250 KB)
    servlet:
      multipart:
        max-file-size: 8MB
        max-request-size: 10MB

  app:
    cors:
      allowed-origin: ${CORS_ORIGIN:http://localhost:4200,http://192.168.1.72:4200}

    # ==========================================================
    # FOTOS DE LOS BIENES (Inventario anual)
    # Con los 4 datos de Cloudflare R2 llenos, las fotos se guardan en R2.
    # Mientras estén vacíos, se guardan en la carpeta local "carpeta-local".
    # R2: Cloudflare > R2 > Crear bucket; luego "Manage R2 API Tokens" > Create API token
    #     (permiso Object Read & Write) y copiar Account ID, Access Key ID y Secret Access Key.
    # ==========================================================
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      bucket: ${R2_BUCKET:dozzer-fotos}
    fotos:
      carpeta-local: ${FOTOS_DIR:fotos-bienes}

    admin:
      email: ${DOZZER_ADMIN_EMAIL:admin@dozzer.com}
      password: ${DOZZER_ADMIN_PASSWORD:AdminDOZZER2026!}

    jwt:
      secret: ${JWT_SECRET:DOZZER_LOCAL_ONLY_SECRET_CHANGE_BEFORE_PRODUCTION_2026_0123456789}
      expiration-minutes: 480
