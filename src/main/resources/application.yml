  server:
    # En Render se usa la variable PORT; en tu computadora, 8080
    port: ${PORT:8080}

  spring:
    application:
      name: dozzer-backend

    # Llaves privadas en un archivo local (NO se sube a git): dozzer-backend/secretos.properties
    # Si no existe, se usan las variables de entorno (así funciona en Render).
    config:
      import:
        - optional:file:./secretos.properties
        - optional:file:./dozzer-backend/secretos.properties

    datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/dozzer}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgres}
      # Supabase gratis acepta pocas conexiones: 5 alcanzan para DOZZER
      hikari:
        maximum-pool-size: ${DB_POOL_SIZE:10}
        minimum-idle: 1

    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
          format_sql: true

    liquibase:
      change-log: classpath:db/changelog/db.changelog-master.xml

    jackson:
      default-property-inclusion: non_null

    # Fotos del inventario anual (se comprimen en el celular, ~250 KB)
    servlet:
      multipart:
        max-file-size: 8MB
        max-request-size: 10MB

  app:
    cors:
      allowed-origin: ${CORS_ORIGIN:http://localhost:4200,http://192.168.1.72:4200}

    # ==========================================================
    # FOTOS DE LOS BIENES (Inventario anual)
    # Orden: 1) Cloudinary  2) Cloudflare R2  3) carpeta local "carpeta-local".
    # Cloudinary: las llaves NO se escriben aquí; van como variables de entorno
    #   CLOUDINARY_CLOUD_NAME, CLOUDINARY_API_KEY, CLOUDINARY_API_SECRET
    #   y CLOUDINARY_FOLDER (dozzer-pruebas en pruebas, dozzer en producción).
    #   Se obtienen en cloudinary.com > Settings > API Keys.
    # ==========================================================
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME:}
      api-key: ${CLOUDINARY_API_KEY:}
      api-secret: ${CLOUDINARY_API_SECRET:}
      folder: ${CLOUDINARY_FOLDER:dozzer}
    # ----------------------------------------------------------
    # Con los 4 datos de Cloudflare R2 llenos (y sin Cloudinary), las fotos se guardan en R2.
    # Mientras estén vacíos, se guardan en la carpeta local "carpeta-local".
    # R2: Cloudflare > R2 > Crear bucket; luego "Manage R2 API Tokens" > Create API token
    #     (permiso Object Read & Write) y copiar Account ID, Access Key ID y Secret Access Key.
    # ==========================================================
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key: ${R2_ACCESS_KEY:}
      secret-key: ${R2_SECRET_KEY:}
      bucket: ${R2_BUCKET:dozzer-fotos}
    fotos:
      carpeta-local: ${FOTOS_DIR:fotos-bienes}
      # false = si no hay Cloudinary ni R2, NO se aceptan fotos (nunca se guardan en local por accidente).
      permitir-local: ${FOTOS_PERMITIR_LOCAL:false}

    admin:
      email: ${DOZZER_ADMIN_EMAIL:admin@dozzer.com}
      password: ${DOZZER_ADMIN_PASSWORD:AdminDOZZER2026!}

    jwt:
      secret: ${JWT_SECRET:DOZZER_LOCAL_ONLY_SECRET_CHANGE_BEFORE_PRODUCTION_2026_0123456789}
      expiration-minutes: 480
